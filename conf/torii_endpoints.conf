# Server Torii endpoints. Include this file once in every server block that
# uses "torii on", after copying this directory to <nginx conf dir>/torii:
#
#     include torii/torii_endpoints.conf;
#
# It expects an upstream named "torii_backend" in the http block, reached
# over TCP or a Unix socket:
#
#     upstream torii_backend {
#         server unix:/run/server_torii.sock;   # or: server 127.0.0.1:25555;
#         keepalive 32;
#     }

# The check. Only the module reaches it; the name is set by torii_endpoint.
location = /_torii {
    internal;
    proxy_pass http://torii_backend/v1/check;
    include torii/torii_params.conf;

    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    # The whole response of Torii is kept in memory to be sent to the client.
    # A page larger than this is treated as "no decision".
    subrequest_output_buffer_size 64k;

    # A slow Torii must not hold client requests for long.
    proxy_connect_timeout 1s;
    proxy_send_timeout 3s;
    proxy_read_timeout 5s;
}

# Endpoints of Torii that browsers call: CAPTCHA submission and the like.
# The prefix must be web_path of torii.yml followed by a slash.
location ^~ /torii/ {
    torii off;
    proxy_pass http://torii_backend/v1/public/;
    include torii/torii_params.conf;
}
