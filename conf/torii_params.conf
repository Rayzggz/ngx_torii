# What the connector tells Server Torii about the client request.
# Included by torii_endpoints.conf.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_intercept_errors off;

proxy_set_header Torii-Site      $torii_site;
proxy_set_header Torii-Client-IP $remote_addr;
proxy_set_header Torii-Host      $host;
proxy_set_header Torii-URI       $request_uri;
proxy_set_header Torii-Method    $request_method;
proxy_set_header Torii-Features  $torii_features;
