# What the connector tells Server Torii about the client request.
# Included by torii_endpoints.conf.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_intercept_errors off;

proxy_set_header Torii-Site      $torii_site;
proxy_set_header Torii-Client-IP $remote_addr;
proxy_set_header Torii-Host      $host;
proxy_set_header Torii-URI       $request_uri;
proxy_set_header Torii-Method    $request_method;
proxy_set_header Torii-Features  $torii_features;

# How the client reached nginx. A header whose value is empty is not sent, and
# a header of these names that the client sent itself never reaches Torii.
proxy_set_header Torii-Scheme       $scheme;
proxy_set_header Torii-Proto        $server_protocol;
proxy_set_header Torii-Header-Order $torii_header_order;
proxy_set_header Torii-TLS          $torii_tls;
# The number of this request among those of its connection, 1 for the first.
proxy_set_header Torii-Connection-Requests $connection_requests;
