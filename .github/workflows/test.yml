name: Test

on:
  push:
    branches: [master, main, connector-v1]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Server Torii branch or tag the module is tested against. It must serve connector
  # protocol v1 (/v1/check).
  TORII_REF: refactor

jobs:
  integration:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # nginx versions, "+dynamic" for the module as a shared object, and OpenResty.
        # t/matrix.sh explains the format.
        target:
          - "1.14.2"
          - "1.16.1"
          - "1.18.0"
          - "1.20.2"
          - "1.22.1"
          - "1.24.0"
          - "1.26.3"
          - "1.28.0"
          - "1.28.0+dynamic"
          - "openresty-1.27.1.2"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: Rayzggz/server_torii
          ref: ${{ env.TORII_REF }}
          path: .server_torii

      - uses: actions/setup-go@v6
        with:
          go-version-file: .server_torii/go.mod
          cache-dependency-path: .server_torii/go.sum

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libpcre2-dev zlib1g-dev perl curl jq python3

      - name: Build nginx with the module and run the integration test
        run: TORII_SRC="$PWD/.server_torii" bash t/matrix.sh "${{ matrix.target }}"

      - name: Build log
        if: failure()
        run: tail -n 100 ~/.cache/ngx-torii-matrix/build/*/build.log || true

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck t/*.sh
