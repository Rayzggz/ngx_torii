name: Test

on:
  push:
    branches: [master, main, connector-v1]
  pull_request:
  # Run by hand ("Run workflow") to also run the integration test against a Server Torii.
  workflow_dispatch:
    inputs:
      torii_ref:
        description: "Server Torii branch, tag or commit for the integration test (empty: build only)"
        required: false
        default: ""
      torii_repository:
        description: Server Torii repository
        required: false
        default: Rayzggz/server_torii

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}-${{ inputs.torii_ref }}
  cancel-in-progress: true

jobs:
  # On a push: builds the module into each version and lets "nginx -t" load a configuration that
  # uses it; no Server Torii is involved. Run by hand with a Server Torii ref: the integration
  # test (t/run.sh) runs against that Torii instead.
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # nginx versions, "+dynamic" for the module as a shared object, and OpenResty.
        # t/matrix.sh explains the format.
        target:
          - "1.14.2"
          - "1.16.1"
          - "1.18.0"
          - "1.20.2"
          - "1.22.1"
          - "1.24.0"
          - "1.26.3"
          - "1.28.0"
          - "1.30.7"
          - "1.30.7+dynamic"
          - "openresty-1.27.1.2"
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libpcre2-dev zlib1g-dev perl curl jq python3

      - name: Build nginx with the module
        if: ${{ !inputs.torii_ref }}
        run: BUILD_ONLY=1 bash t/matrix.sh "${{ matrix.target }}"

      - name: Check out Server Torii
        if: ${{ inputs.torii_ref }}
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.torii_repository }}
          ref: ${{ inputs.torii_ref }}
          path: .server_torii

      - if: ${{ inputs.torii_ref }}
        uses: actions/setup-go@v6
        with:
          go-version-file: .server_torii/go.mod
          cache-dependency-path: .server_torii/go.sum

      - name: Build nginx with the module and run the integration test
        if: ${{ inputs.torii_ref }}
        run: TORII_SRC="$PWD/.server_torii" bash t/matrix.sh "${{ matrix.target }}"

      - name: Build log
        if: failure()
        run: tail -n 100 ~/.cache/ngx-torii-matrix/build/*/build.log || true

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck t/*.sh
